<script>
(()=>{
const sections=[...document.querySelectorAll('main>.section')];
const present=document.getElementById('present'),previous=document.getElementById('previous'),next=document.getElementById('next'),status=document.getElementById('present-status');
let presenting=false,current=0;
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)');
function showSlide(index,scroll=true){current=Math.max(0,Math.min(index,sections.length-1));sections.forEach((s,i)=>s.classList.toggle('is-current',i===current));previous.disabled=current===0;next.disabled=current===sections.length-1;status.textContent=`${String(current+1).padStart(2,'0')} / ${sections.length} · ${sections[current].dataset.title}`;if(scroll)window.scrollTo({top:0,behavior:'instant'});updateProgress();}
function setPresenting(value){if(value){current=Math.max(0,sections.findLastIndex(s=>s.getBoundingClientRect().top<140));}presenting=value;document.body.classList.toggle('presenting',value);present.setAttribute('aria-pressed',String(value));present.textContent=value?'Exit presentation':'Present';showSlide(current,value);if(!value)sections[current].scrollIntoView({behavior:'instant',block:'start'});}
present.addEventListener('click',()=>setPresenting(!presenting));previous.addEventListener('click',()=>showSlide(current-1));next.addEventListener('click',()=>showSlide(current+1));
document.addEventListener('keydown',e=>{if(!presenting||e.target.closest('input,textarea,select,summary'))return;if(e.key==='Escape'){setPresenting(false);present.focus();}if(e.key==='ArrowRight'){e.preventDefault();showSlide(current+1);}if(e.key==='ArrowLeft'){e.preventDefault();showSlide(current-1);}});
document.querySelectorAll('a[href^="#"]').forEach(a=>a.addEventListener('click',e=>{const target=document.getElementById(a.hash.slice(1));if(!target)return;if(target.matches('.direction'))revealDirection(target);const sec=target.closest('main>.section');if(presenting&&sec){e.preventDefault();showSlide(sections.indexOf(sec));if(target!==sec){target.open=true;target.scrollIntoView({behavior:reduced.matches?'instant':'smooth',block:'start'});}}else if(target.matches('details'))target.open=true;}));
function updateProgress(){const max=document.documentElement.scrollHeight-window.innerHeight;document.querySelector('.progress').style.width=(presenting?(current+1)/sections.length*100:max>0?window.scrollY/max*100:0)+'%';}
window.addEventListener('scroll',updateProgress,{passive:true});window.addEventListener('resize',updateProgress);updateProgress();
const filters=[...document.querySelectorAll('[data-filter]')],directions=[...document.querySelectorAll('.direction')],search=document.getElementById('direction-search');let active='all';
function filterDirections(){const query=search.value.trim().toLowerCase();let shown=0;directions.forEach(d=>{const visible=(active==='all'||d.dataset.fit===active)&&d.dataset.search.includes(query);d.hidden=!visible;if(visible)shown++;});document.getElementById('results-count').textContent=`${shown} of ${directions.length} directions`;document.getElementById('no-results').hidden=shown!==0;}
filters.forEach(b=>b.addEventListener('click',()=>{active=b.dataset.filter;filters.forEach(x=>x.setAttribute('aria-pressed',String(x===b)));filterDirections();}));search.addEventListener('input',filterDirections);

window.addEventListener('beforeprint',preparePrint);window.addEventListener('afterprint',restorePrint);document.getElementById('print').addEventListener('click',()=>window.print());
function revealDirection(target){active='all';search.value='';filters.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.filter==='all')));filterDirections();target.open=true;}
const initial=document.getElementById(location.hash.slice(1));if(initial?.matches('.direction'))revealDirection(initial);else if(initial?.matches('details'))initial.open=true;
})();
